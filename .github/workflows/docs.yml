---
# Check every change; on main, publish the site. Its notices.json is what the cluster bot
# posts in Slack, each notice on its date (deepops cluster_bot.notices): no Slack secret here.
name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - name: Unit tests
        run: uv run python -m unittest discover -s tests
      - name: Generated blocks match data/site.json (the cluster's facts, from deepops site_facts.py)
        run: uv run python scripts/site_blocks.py --check
      - name: Notices, and a notice for every policy change
        run: uv run python scripts/notices.py check "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}
      - name: Hooks (built-in secret rules; site rules stay private)
        run: |
          uv run pre-commit run --all-files --show-diff-on-failure
          uv run pre-commit run sensitive-guard-tree --hook-stage manual --all-files
      - name: Build (strict) and check every internal link and anchor
        run: |
          uv run zensical build --strict
          uv run python scripts/check_links.py
      - name: Export the agent rules (published as agents/AGENTS.md)
        run: uv run python scripts/agent_rules.py --out site/agents/AGENTS.md
      - name: Write llms.txt and llms-full.txt (the site for AI agents, at its root)
        run: uv run python scripts/llms.py --out site
      - name: Export the notices as Slack messages (notices.json, read by the cluster bot)
        run: uv run python scripts/notices.py export site/notices.json
      - name: Export the Slack channels' guides (channels.json, kept by the cluster bot)
        run: uv run python scripts/channels.py export site/channels.json
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
