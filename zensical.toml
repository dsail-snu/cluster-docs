# Zensical site configuration. Content rules: CONTRIBUTING.md.
[project]
site_name = "GPU 클러스터 사용 가이드"
site_description = "연구실 GPU 클러스터 사용법, 규정, 공지"
site_url = "https://dsail-snu.github.io/cluster-docs/"  # sensitive-guard: allow (public org URL)
docs_dir = "docs"
site_dir = "site"
nav = [
  { "홈" = "index.md" },
  { "시작하기" = [
    "start/connect.md",
    "start/first-job.md",
    "start/slurm-basics.md",
  ] },
  { "사용 규정" = [
    "policy/index.md",
    "policy/ai-agents.md",
  ] },
  { "가이드" = [
    "guide/job-recipes.md",
    "guide/containers.md",
    "guide/modules.md",
    "guide/storage.md",
    "guide/monitoring.md",
    "guide/troubleshooting.md",
  ] },
  { "레퍼런스" = ["reference/slurm.md"] },
  { "공지" = "news/index.md" },
  { "도움 받기" = "help.md" },
]

[project.theme]
language = "ko"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "밝은 화면으로"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "어두운 화면으로"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "시스템 설정 따르기"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
# Unicode heading anchors, so Korean headings get stable links (e.g. #디버깅).
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

# Notices: one file per notice in docs/news/posts (see CONTRIBUTING.md).
[project.plugins.blog]
blog_dir = "news"
post_date_format = "long"
post_url_format = "{date}/{slug}"

[project.plugins.rss]
match_path = "news/posts/.*"
date_from_meta = { as_creation = "date" }
